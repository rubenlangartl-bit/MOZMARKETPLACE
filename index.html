<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MozabazarHub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 15px;
        }

        .search {
            width: 90%;
            max-width: 600px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        h2 {
            margin-bottom: 15px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 30px;
        }

        .category {
            background: white;
            padding: 12px 18px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product h3 {
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .location {
            color: #777;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            padding: 25px;
            background: #111;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 MozabazarHub</h1>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="O que estás à procura?"
    >
</header>

<div class="container">

    <h2>Categorias</h2>

    <div class="categories">
        <div class="category">📱 Telemóveis</div>
        <div class="category">💻 Computadores</div>
        <div class="category">👟 Moda</div>
        <div class="category">🚗 Carros</div>
        <div class="category">🏠 Casa</div>
        <div class="category">🎮 Jogos</div>
    </div>

    <h2>Produtos recentes</h2>

    <div class="products" id="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Telemóvel">

            <div class="product-info">
                <h3>Samsung Galaxy</h3>
                <p class="price">8.500 MT</p>
                <p class="location">📍 Maputo</p>

                <button onclick="contactSeller()">
                    Contactar vendedor
                </button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853" alt="Laptop">

            <div class="product-info">
                <h3>Laptop HP</h3>
                <p class="price">18.000 MT</p>
                <p class="location">📍 Matola</p>

                <button onclick="contactSeller()">
                    Contactar vendedor
                </button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Tênis">

            <div class="product-info">
                <h3>Tênis</h3>
                <p class="price">2.500 MT</p>
                <p class="location">📍 Maputo</p>

                <button onclick="contactSeller()">
                    Contactar vendedor
                </button>
            </div>
        </div>

    </div>

</div>

<footer>
    © 2026 MozabazarHub — Compra e vende em Moçambique 🇲🇿
</footer>

<script>
    function contactSeller() {
        alert("Em breve poderás contactar o vendedor pelo WhatsApp!");
    }

    const search = document.getElementById("search");

    search.addEventListener("input", function () {

        const text = search.value.toLowerCase();
        const products = document.querySelectorAll(".product");

        products.forEach(product => {

            const name = product
                .querySelector("h3")
                .textContent
                .toLowerCase();

            product.style.display =
                name.includes(text) ? "block" : "none";
        });
    });
</script>

</body>
</html>
